analysis_rules:
  platform_variable: >-
    YuLan EventBus routes StartEvent plus four child PolicyNotice events for a
    present policy, or four DecisionTick events for absence. Prompts are built
    only inside each resident's add_event receiver method.
  benchmark_owned_semantics: >-
    Policy registration, activation, eligibility, candidate actions and state
    effects are frozen benchmark rules, not claimed as native YuLan policy
    features. GAWorld UrbanPolicyChannel is not imported or executed by the
    YuLan adapter.
  delivery: >-
    A notice counts as perceived only inside the addressed resident's add_event
    method. Internal EventBus attempts and native flow exports are retained but
    are not sufficient delivery evidence.
  paired_comparison: >-
    Pair each YuLan cell with GAWorld repeat 1 by task and policy state. Require
    exact per-resident prompt hashes before interpreting output differences.
  no_post_hoc_prompt_change: true
  no_replacement_calls: true
  invalid_responses_remain_in_denominator: true

interpretation_limits:
  - This 9-cell run is a repeat-1 protocol-parity pilot, not the original 18-cell repeatability study.
  - It tests EventBus delivery plus benchmark-owned policy semantics, not all native YuLan scenarios.
  - One model, one repeat and three reused development surfaces cannot establish a platform ranking.
  - H1-H7 human validity dimensions are outside this functional experiment.
  - Wall-clock latency is not compared because platforms were not randomized concurrently.

stopping_rules:
  - Run and pass all 9 deterministic fixture cells before live execution.
  - Stop after all 9 live cells finish or before a call exceeding the 36-call budget.
  - Do not retry or replace structurally valid, invalid, provider-failed or interrupted cells.

planned_entrypoint: >-
  python -m cross_platform.yulan_onesim.t5_run --provider paratera_glm
  --allow-live-model --out output/cross_platform_yulan_t5_glm52_<run_id>
credential_policy: PARATERA_API_KEY is read from the environment and never logged
