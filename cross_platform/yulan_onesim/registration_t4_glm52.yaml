    - communication_value_remove_bridge
    - communication_value_drop_bridge

analysis_rules:
  same_prompt: >-
    Reuse model_pilot.t4_v2._call so each role sees the frozen GAWorld prompt.
  delivery: >-
    Count message_delivered only inside the registered receiver's add_event call;
    an EventBus internal attempt or native flow step alone is insufficient.
  comparison: >-
    Compare the 18-cell FullPass vector and aggregate track/variant rates to the
    locked GAWorld seed-0 reference. Do not compare wall-clock latency because
    execution and prior network conditions were not randomized concurrently.
  negative_controls: >-
    remove_bridge and drop_bridge must prevent target receipt. A control cell may
    still pass by keeping the current action; an intervention cell must fail when
    its required update cannot reach the target.
  no_post_hoc_prompt_change: true
  no_replacement_calls: true
  invalid_responses_remain_in_denominator: true

interpretation_limits:
  - This is a protocol-parity adapter test, not a score for all native YuLan scenarios.
  - One model and one seed establish a pilot comparison, not a general platform ranking.
  - H1-H7 human validity dimensions are outside this functional experiment.
  - The adapter supplies receiver receipts because R0 found native flow export insufficient.

stopping_rules:
  - Run and pass the 18-cell deterministic oracle fixture before live execution.
  - Stop after all 18 live cells finish.
  - Stop before any call that would exceed the shared 60-call budget.
  - Do not retry or replace structurally valid, invalid, or provider-failed cells.

planned_entrypoint: >-
  python -m cross_platform.yulan_onesim.t4_run --provider paratera_glm
  --allow-live-model --out output/cross_platform_yulan_t4_glm52_<run_id>
credential_policy: PARATERA_API_KEY is read from the environment and never logged
