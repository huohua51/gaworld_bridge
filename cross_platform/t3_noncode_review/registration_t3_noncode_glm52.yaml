analysis_rules:
  paired_unit: same task and evidence variant across the two platforms
  platform_variable: >-
    GAWorld routes proposal, private reviewer context, structured review and
    adoption through ReviewChannel. YuLan routes explicitly payload-bearing
    child events through EventBus and records receiver-side receipts.
  prompt_parity: >-
    The proposer, reviewer and executor prompt SHA-256 hashes must match within
    every platform pair before output differences are interpreted.
  private_information: >-
    The complete verified evidence values must appear in the reviewer request
    and must not appear in proposer or executor requests. Evidence IDs may be
    present in the delivered review.
  reject_transport: >-
    GAWorld ReviewChannel's revise value is a carrier for the common reject
    decision. The common review JSON is restored before the executor prompt.
  measurement: >-
    Receiver-side evidence, not native dispatch attempts alone, establishes
    delivery. Exactly three requests and three responses are required per cell.
  no_post_hoc_prompt_change: true
  no_replacement_calls: true
  invalid_responses_remain_in_denominator: true

interpretation_limits:
  - This is a 12-cell, one-model, one-seed protocol-parity pilot.
  - Three task surfaces do not represent all T3 work-review behavior.
  - Benchmark-owned tasks and transition rules are not native product scenarios.
  - The experiment is not eligible for an overall platform ranking.
  - H1-H7 human validity dimensions are outside this functional experiment.
  - Wall-clock latency is not compared because platform order is paired but not concurrent.

stopping_rules:
  - Run all 12 deterministic fixture cells and require 36/36 valid fixture responses before live execution.
  - Commit the registration and frozen inputs before the first live request.
  - Stop after all 12 live cells finish or before a call exceeding the 36-call budget.
  - Do not retry or replace structurally invalid, provider-failed or interrupted cells.

planned_entrypoint: >-
  python -m cross_platform.t3_noncode_review.run --provider paratera_glm
  --allow-live-model --out output/cross_platform_t3_noncode_glm52_<run_id>
credential_policy: PARATERA_API_KEY is read from the environment and never logged
