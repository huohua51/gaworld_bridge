question: >-
  With new non-code tasks, private evidence, prompts, GLM-5.2 settings and
  evidence-first scoring held constant, does the proposal to independent review
  to approve/reject to state-update chain behave differently when routed through
  GAWorld ReviewChannel versus YuLan-OneSim EventBus?

