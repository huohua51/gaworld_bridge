analysis_rules:
  platform_variable: >-
    Only the path through AgentSociety 2 SimpleSocialSpace is new. The reviewer
    object, evidence ID, proposal and executor transition are held fixed.
  payload_transport: >-
    Score only structurally valid source reviewer samples. Require exact object
    equality, exact canonical SHA-256, native sender/receiver observations,
    final submission and the registered deterministic transition.
  functional_full_pass: >-
    Retain the source-invalid reviewer sample in the six-unit denominator. It
    remains an upstream failure and is not relabelled as an AgentSociety failure.
  identity_boundary: >-
    Report the native claimed-agent-id probe separately. Do not insert an ACL in
    the adapter because that would measure benchmark code rather than the native
    public tool surface.
  yulan_acl_status: not_tested; do not infer pass or fail from the v2 replay
  no_post_hoc_task_change: true
  no_sample_replacement: true
  no_new_model_sampling: true

interpretation_limits:
  - This tests one AgentSociety 2 mailbox surface, not the full platform.
  - It does not exercise city, economy, mobility, memory quality or large-population scaling.
  - Deterministic execution tests transport fidelity, not free-form agent ability.
  - The identity result applies only to the tested public tool boundary; an authenticated deployment layer may add controls.
  - The three task surfaces and six historical samples do not support an overall platform ranking.
  - H1-H7 human validity dimensions are outside this functional experiment.

stopping_rules:
  - Require 6/6 offline oracle transport and functional passes before registration.
  - Commit this registration and all new frozen code before the formal historical replay.
  - Execute exactly six AgentSociety cells in the frozen task/variant order.
  - Make zero model calls and do not replace the invalid source sample.
  - Abort before replay if any frozen input hash or AgentSociety commit/hash differs.
  - Preserve every formal cell, including failures, after execution begins.

planned_entrypoint: >-
  python -m cross_platform.t3_noncode_replay_v3.run --historical-replay
  --out output/cross_platform_t3_noncode_replay_v3_agentsociety_20260905
