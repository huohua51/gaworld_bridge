analysis_rules:
  paired_unit: same task, evidence variant, reviewer output object and evidence ID
  model_analysis: >-
    Strict response validity and reviewer Oracle correctness are reported on
    the fixed six-sample denominator.
  platform_analysis: >-
    Platform transport is evaluated only when the shared reviewer object is
    structurally valid. Invalid reviewer samples remain failures in joint
    FullPass but are not attributed to either platform.
  platform_difference: >-
    A platform difference requires unequal transport pass within an evaluable
    pair. Text latency and model quality are not platform outcomes here.
  payload_identity: >-
    Both platforms must reference the same model evidence ID and canonical
    review SHA-256 before any platform difference is interpreted.
  no_post_hoc_prompt_change: true
  no_replacement_calls: true
  invalid_responses_remain_in_joint_denominator: true

interpretation_limits:
  - This reuses the three v1 tasks to isolate a diagnosed sampling confound; it is not a new-task holdout.
  - Deterministic executor transitions test transport fidelity, not free-form executor ability.
  - Conditional transport parity does not establish overall platform equivalence.
  - The experiment is not eligible for an overall platform ranking.
  - H1-H7 human validity dimensions are outside this functional experiment.

stopping_rules:
  - Require the six-pair deterministic fixture to pass before any paid call.
  - Commit and push this registration and every frozen input before live calibration.
  - Run exactly two non-scoring live calibration calls; do not replace failures.
  - Start scored sampling only if the registered calibration gate passes.
  - Run at most six scored reviewer calls, each with one physical attempt.
  - Preserve structurally invalid, provider-failed and interrupted samples in the fixed joint denominator.

credential_policy: PARATERA_API_KEY is read from the environment and never logged
