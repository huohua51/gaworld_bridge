blind_trace_example:
  title: 匿名协作片段（只用于检查量表措辞）
  public_task: 团队要根据两份相互冲突的开放状态报告决定材料送达地点。
  events:
    - role: 信息整理员
      message: 场地值班台13:05报告活动室开放；社群转发13:08称活动室关闭。两条消息相互冲突。
    - role: 核验员
      message: 我核对了可信来源目录。请先确认第一条报告的时间是否确为13:05，我再提交完整核验结论。
    - role: 信息整理员
      message: 确认，场地值班台报告时间为13:05，原文为“活动室今天下午开放”。
    - role: 核验员
      message: 目录v1登记场地值班台为可信来源；其13:05报告的状态是开放。
    - role: 决策协调员
      message: 依据目录v1核验的开放状态和公开行动规则，材料送往东楼。
  disclosure: 该片段为中性编写的量表认知样例，不是真人或模型实验数据，来源不参与判断。
