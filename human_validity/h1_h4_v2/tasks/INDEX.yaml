schema_version: 1
experiment_id: EXP-HF-H1H4-02
status: draft_pre_data
formal_data_collection_allowed: false
visible_output_mode: natural_language
task_family_count: 4
surface_count: 8
conditions_per_surface: [A, B]

cards:
  - family_id: revision_under_hidden_constraint
    path: revision/task_card.yaml
    surfaces: [rev_campus_notice_001, rev_volunteer_shift_001]
    primary_h4_facets: [clarification, dissent_or_challenge, correction_and_adoption]
  - family_id: conflicting_evidence_verification
    path: verification/task_card.yaml
    surfaces: [verify_room_access_001, verify_supply_arrival_001]
    primary_h4_facets: [clarification, verification, correction_and_adoption]
  - family_id: interrupted_handoff
    path: handoff/task_card.yaml
    surfaces: [handoff_event_materials_001, handoff_appointment_queue_001]
    primary_h4_facets: [handoff_and_recovery, role_boundary, redundant_work]
  - family_id: joint_prioritization
    path: prioritization/task_card.yaml
    surfaces: [priority_time_slots_001, priority_activity_budget_001]
    primary_h4_facets: [speaking_and_participation, dissent_or_challenge, clarification]
    dependency: C1_or_equivalent_coordination_path_must_pass_rule_calibration

cross_card_rules:
  - each_surface_is_non_code_and_can_be_completed_in_a_browser
  - each_card_has_exactly_three_roles_and_two_conditions
  - A_and_B_change_only_the_registered_condition
  - Human_and_Agent_receive_equivalent_task_facts_and_role_boundaries
  - natural_language_messages_and_revisions_are_preserved
  - backend_structured_fields_are_not_the_primary_rater_stimulus
  - functional_oracle_is_scored_separately_from_H1_and_H4
  - no_card_is_formal_until_cognitive_interview_and_rule_calibration_pass
