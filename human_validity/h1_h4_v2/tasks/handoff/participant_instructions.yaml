schema_version: 1
experiment_id: EXP-HF-H1H4-02
task_id: h1h4_interrupted_handoff_v2
status: draft_for_cognitive_interview
formal_data_collection_allowed: false
language: zh-CN
condition_label_visible: false
source_label_visible: false
file_is_server_side_only: true
render_contract:
  participant_visible_sections:
    - common_intro
    - assigned_role_card.screen_title
    - assigned_role_card.participant_text
    - assigned_role_card.available_actions
    - assigned_role_card.completion_check
    - server_rendered_visible_bindings
    - pre_task_comprehension.items.prompt
  never_send_to_client:
    - other_role_cards
    - hidden_bindings
    - condition_code
    - source_kind
    - pre_task_comprehension.items.expected_concept

common_intro:
  title: 中断与交接任务
  purpose_text: 团队要按顺序完成三个阶段。第一阶段后平台会封存检查点并通知由原执行者继续还是由第二执行者接替。
  privacy_text: 任务记录只使用页面给出的虚构代号；不要输入姓名、联系方式或其他身份信息。
  interaction_rules:
    - 平台封存的检查点是后续工作的唯一状态起点，不要覆盖旧记录。
    - 只处理平台当前分配给你的阶段和材料。
    - 发现检查点或交接信息不足时，提出具体澄清并说明缺少什么。
    - 不重复已在封存检查点中确认完成的阶段。

role_cards:
  - role_id: worker_A
    screen_title: 你的角色：第一执行者
    visible_bindings:
      - public_goal_and_stage_order
      - stage_1_material
      - messages_addressed_to_worker_A
      - checkpoint_after_server_seal
      - availability_event
      - later_stage_material_only_if_assigned
    hidden_bindings:
      - later_stage_material_before_assignment
      - condition_code
      - source_kind
    participant_text:
      - 完成第一阶段，按页面事实记录结果，不补充材料中没有的信息。
      - 提交检查点摘要，写清已完成阶段、观察事实、未解决问题和不得重复的工作。
      - 等待平台封存检查点并发布可用性通知；不要自行决定谁继续。
      - 如果平台指派你继续，再确认检查点版本和恢复阶段后完成剩余工作；如果通知你不可用，立即停止业务操作。
    available_actions:
      - submit_stage_1_result
      - submit_checkpoint_summary
      - acknowledge_resume_if_assigned
      - ask_handoff_clarification_if_assigned
      - submit_remaining_stages_if_assigned
    completion_check:
      - 检查点四项必填内容完整且符合第一阶段事实
      - 没有自行填写或修改平台版本号
      - 只在被指派继续时读取和提交后续阶段

  - role_id: coordinator
    screen_title: 你的角色：协调员
    visible_bindings:
      - public_goal_and_stage_order
      - sealed_checkpoint
      - availability_event
      - messages_addressed_to_coordinator
    hidden_bindings:
      - unreleased_later_stage_material
      - condition_code
      - source_kind
    participant_text:
      - 阅读平台封存的检查点和可用性通知，指定正确的继续者和恢复阶段。
      - 交接消息要写出检查点版本、已完成阶段、下一阶段和仍待处理的问题。
      - 你负责协调，不执行具体业务步骤，也不给出后续阶段的正确答案。
      - 如果检查点缺少恢复所需信息，只能请求补充，不能自行改写封存记录。
    available_actions:
      - request_checkpoint_clarification
      - submit_handoff
      - answer_assignment_clarification
    completion_check:
      - 指派对象与平台可用性通知一致
      - 恢复阶段紧接已完成阶段
      - 没有执行业务步骤或泄露后续答案

  - role_id: worker_B
    screen_title: 你的角色：第二执行者
    visible_bindings:
      - public_goal_and_stage_order
      - sealed_checkpoint
      - handoff_message
      - later_stage_material_only_if_assigned
      - messages_addressed_to_worker_B
    hidden_bindings:
      - stage_1_raw_material
      - later_stage_material_before_assignment
      - condition_code
      - source_kind
    participant_text:
      - 在未收到平台分配前保持待命，不提交业务结果。
      - 如果被指派接替，先确认检查点版本、已完成阶段和恢复阶段；信息不足时提出澄清。
      - 从指定阶段继续，不重复第一阶段，也不覆盖封存检查点。
      - 如果没有被指派，只确认待命，不读取或处理后续材料。
    available_actions:
      - acknowledge_standby
      - acknowledge_resume_if_assigned
      - ask_handoff_clarification_if_assigned
      - submit_remaining_stages_if_assigned
    completion_check:
      - 只有被指派时才提交业务结果
      - 恢复声明引用正确检查点和阶段
      - 没有重复或覆盖第一阶段

pre_task_comprehension:
  pass_rule: all_role_specific_items_correct_before_task_access
  attempts_before_facilitator_review: 2
  items:
    - id: handoff_assignment
      prompt: 第一阶段结束后，谁决定由哪位执行者继续？
      expected_concept: 根据平台可用性通知，由协调员发出交接；执行者不能自行决定。
    - id: handoff_redundancy
      prompt: 接替者看到检查点写明第一阶段已完成时，是否应重新做第一阶段？
      expected_concept: 不应；应从交接指定的下一阶段继续。
