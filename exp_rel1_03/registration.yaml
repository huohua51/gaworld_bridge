question: >-
  On fresh reliability-update surfaces, does phase-separated prompting let
  GLM-5.2 exactly relay both current signals, form trust from complete
  per-source history counts, replace that choice using only the latest binding
  outcome, and choose business values while the platform binds both actions to
  adopted trust messages?

