  name: paratera_glm
  gateway: paratera
  model: GLM-5.2
  base_url: https://llmapi.paratera.com/v1
  api_protocol: openai_chat_completions
  api_key_env: PARATERA_API_KEY
  temperature: 0.0
  thinking: disabled
  max_tokens_per_call: 384

design:
  task_ids: [rel1_03_power_feeder_001, rel1_03_alpine_road_001, rel1_03_desalination_001]
  variants: [control, intervention]
  track: full
  seeds: [0]
  calls_per_cell: 5
  max_calls: 30
  scorer_version: rel1-phase-separated-v3.0
  fresh_relative_to: [EXP-GM-REL1, EXP-GM-REL1-02]

registered_call_order:
  - observer_exact_current_signal_relay
  - trust_updater_formation_count
  - dispatcher_formation_value
  - trust_updater_latest_binding_update
  - dispatcher_update_value

repairs:
  AP-REL1-01:
    - update has a separate prompt and uses only the final ordered history row
    - evidence_row_ids must contain only that latest row
  AP-REL1-02:
    - formation has no latest-binding rule in its prompt
    - formation reports counts and every supporting row ID for both sources
    - source display order has no priority meaning
  AP-REL1-03:
    - dispatcher model outputs selected_value only
    - platform binds registered action name, delivered message ID, adopted trust version, and phase
  measurement_relay:
    - observer must copy both registered signals exactly

registered_gate:
  coverage: 1.0
  full_pass_rate: 1.0
  observer_relay_faithful: 1.0
  formation_counts_correct: 1.0
  formation_source_correct: 1.0
  update_source_correct: 1.0
  formation_action_bound: 1.0
  update_action_bound: 1.0

stopping_rule: >-
  Run the six seed-0 cells exactly once and stop. Preserve any failed result.
  Do not change frozen prompts, tasks, oracle, scorer, or platform binding code
  based on live output. Proceed to T4 cross-model replication after recording
  the outcome; do not create REL1-v4 in this run.

scope_limits:
  - A pass closes AP-REL1-01, AP-REL1-02, and AP-REL1-03 as implementation regressions.
  - A pass does not rescore or overwrite EXP-GM-REL1 or EXP-GM-REL1-02.
  - This is registered source-reliability behavior, not a claim about human interpersonal trust.
  - One model and one seed do not establish broad model generalization.

