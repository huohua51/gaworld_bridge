    platform_plan_version: landed_on_joint_assignment_channel
    ap_c1_f_01: still_open
  holdout_allowed: [T3, I1, L1]
  holdout_not_allowed: [C1, REL1, N1]
  holdout_experiments:
    T3: HO-GM-T3-01
    I1: HO-GM-I1-01
    L1: HO-GM-L1-01
  next:
    - do_not_tune_holdout_protocol
    - do_not_enter_ranking
    - h1_infrastructure: EXP-HF-H1-01
    - cross_model_robustness_not_started

