experiments:
  - id: EXP-GM-04a
    mechanism: 基础工作队列
    model_result: 全通过
    conclusion: 静态微任务中工作管线不丢产物
    ranking_eligible: false

  - id: EXP-GM-04b
    mechanism: 需求版本传播
    model_result: 全通过
    conclusion: 执行前能读取并采用最新需求
    ranking_eligible: false

  - id: EXP-GM-04c
    mechanism: 审核通道与权限
    model_result: 部分成功
    conclusion: Reviewer—Executor 协作协议不稳定
    set: development_and_regression
    ranking_eligible: false

  - id: EXP-GM-I1
    mechanism: 可信信息通信
    model_result: Full=1.0
    conclusion: 核验消息具有因果价值，Verifier 角色必要
    track_aliases:
      focused: direct_verified_state
    communication_propagation_gap: 0.0_after_direct_state_contract_fix
    ranking_eligible: false
    holdout: HO-GM-I1-01
    scores_unchanged: true

