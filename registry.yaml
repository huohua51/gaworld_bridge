# Formal experiment registry. Model is a control variable, not the ranking object.
# F-axes and H-axes stay separate. Do not mix WorkDiag / SocietyDiag numbers here.

core_finding: >
  GAWorld 的底层通信、权限和状态传播机制可以正常工作；
  随着任务从“传递明确状态”升级为“理解审核意见”和“按登记规则更新来源可靠性”，
  失败逐渐转移到 Agent 协作协议与社会推理层。
  功能侧做完不等于满分。每个代表功能只需落到可解释状态。

