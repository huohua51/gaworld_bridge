schema_version: 1
tasks:
  - id: t5v2_water_restriction_001
    policy_id: water-restriction-v1
    policy_version: v1
    effective_step: 3
    policy_signal:
      name: dry-season outdoor water restriction
      channel: utility_notice
    target_groups: [high_water_use_household]
    target_action: reduce_outdoor_watering
    action_effects:
      keep_current: {}
      reduce_outdoor_watering:
        watering_schedule: restricted
        weekly_water_units: 18
    residents:
      - agent_id: water-high-1
        group: high_water_use_household
        state: {watering_schedule: daily, weekly_water_units: 35}
      - agent_id: water-high-2
        group: high_water_use_household
        state: {watering_schedule: daily, weekly_water_units: 32}
      - agent_id: water-efficient-1
        group: efficient_household
        state: {watering_schedule: limited, weekly_water_units: 17}
      - agent_id: water-apartment-1
        group: apartment_household
        state: {watering_schedule: none, weekly_water_units: 10}

  - id: t5v2_heat_activity_001
    policy_id: heat-activity-rule-v1
    policy_version: v1
    effective_step: 5
    policy_signal:
      name: extreme-heat outdoor activity rule
      channel: school_safety_notice
    target_groups: [outdoor_program]
    target_action: move_activity_indoors
    action_effects:
      keep_current: {}
      move_activity_indoors:
        activity_location: indoor_gym
        heat_exposure_minutes: 0
    residents:
      - agent_id: heat-sports-1
        group: outdoor_program
        state: {activity_location: sports_field, heat_exposure_minutes: 60}
      - agent_id: heat-sports-2
        group: outdoor_program
        state: {activity_location: track, heat_exposure_minutes: 45}
      - agent_id: heat-class-1
        group: indoor_program
        state: {activity_location: classroom, heat_exposure_minutes: 0}
      - agent_id: heat-remote-1
        group: remote_program
        state: {activity_location: home, heat_exposure_minutes: 0}

  - id: t5v2_organics_rule_001
    policy_id: organics-separation-v1
    policy_version: v1
    effective_step: 7
    policy_signal:
      name: commercial organics separation rule
      channel: sanitation_notice
    target_groups: [food_service_business]
    target_action: separate_organic_waste
    action_effects:
      keep_current: {}
      separate_organic_waste:
        waste_stream: separated_organics
        mixed_waste_units: 4
    residents:
      - agent_id: waste-cafe-1
        group: food_service_business
        state: {waste_stream: mixed, mixed_waste_units: 12}
      - agent_id: waste-cafe-2
        group: food_service_business
        state: {waste_stream: mixed, mixed_waste_units: 10}
      - agent_id: waste-office-1
        group: office_business
        state: {waste_stream: recycling, mixed_waste_units: 5}
      - agent_id: waste-home-1
        group: residential
        state: {waste_stream: household, mixed_waste_units: 3}
