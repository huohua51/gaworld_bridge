registered_call_order:
  - agent_a_private_report
  - agent_b_private_report
  - coordinator_phase1_proposal
  - coordinator_post_revision_proposal
  - agent_a_confirmation
  - agent_b_confirmation

platform_invariants:
  - Models may output assignments and confirmations, never plan_id, plan_version, or spec_version.
  - Only accepted proposals receive a platform plan_id.
  - Registering the protection record advances spec-001 to spec-002.
  - A plan stamped under spec-001 is stale and cannot be confirmed after the revision.
  - The NACK names violated constraints but never the low-priority repair slot.
  - Only registry-confirmed claims bound to the delivered current-spec plan enter world state.
  - The platform and environment never rewrite model assignments.

registered_gate:
  coverage: 1.0
  full_pass_rate: 1.0
  nack_path_intervention: 1.0
  nack_path_control: 0.0
  retry_recovery_intervention: 1.0
  platform_identifier_ownership: 1.0
  spec_revision_advanced: 1.0
  stale_plan_rejected: 1.0

stopping_rule: >-
  Run exactly the six seed-0 cells once. Stop after recording any result. Do
  not edit prompts, tasks, oracle, scorer, platform channel, or core registry
  based on live output. A failed registered gate remains evidence and requires
  a new experiment number for further repair.

scope_limits:
  - A pass closes AP-C1-D-01 and AP-C1-F-01 as implementation regressions only.
  - A pass does not overwrite the frozen scores of C1-02 or C1-03.
  - One model and one seed do not support a broad model-generalization claim.
  - Drop-delivery and rejected-proposal stamping are deterministic platform tests, not extra paid cells.

