question: >-
  After assigning plan/spec identifiers exclusively to the platform, does
  GLM-5.2 recover from all three registered protection NACKs on fresh C1
  surfaces while preserving the no-NACK control path and binding both agents'
  execution to the current-spec accepted plan?

