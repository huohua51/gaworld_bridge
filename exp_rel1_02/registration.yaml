repairs:
  AP-REL1-01:
    - update uses only the final ordered history row when latest_is_binding=true
    - cited evidence_row_ids must contain only that latest row
  AP-REL1-02:
    - formation counts report==outcome rows for every neutral source ID
    - source display order has no priority meaning
    - formation cites all supporting history row IDs
  AP-REL1-03:
    - dispatcher model outputs selected_value only
    - platform binds registered action name, delivered message ID, adopted trust version, and round

