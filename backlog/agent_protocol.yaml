    name: typed_patch_acknowledged_not_applied
    status: retired_protocol
    layer: agent_protocol
    ranking_eligible: false
    retired_as: not_official_gaworld_interface
    scores_unchanged: true
    symptom: 模型声明采用 patch，但登记常量没有改变
    evidence:
      declared_patch_adoption_rate: 1.0
      verified_patch_adoption_rate: 0.0
      acknowledgement_execution_gap: 1.0
      cells:
        - w1_wage_gate_evidence_bound (3/3, APPLIED_PATCH_IDS 已写，THRESHOLD 仍为 60000)
        - w1_return_floor_evidence_bound (3/3, RATE 仍为 0.3)
        - w1_budget_remaining_evidence_bound (3/3, BUDGET 仍为 100，另写 THRESHOLD=80)
    do_not_conclude:
      - Executor 不会修改数字
      - GAWorld 文件工具失效
    do_not_build:
      - 自动应用 patch 的环境工具（那会让环境替 Agent 完成修改）
    retest_requirement:
      - 必须检查真实文件值
      - 不能只检查 APPLIED_PATCH_IDS
      - 不得使用原 04e 开发集继续调参
