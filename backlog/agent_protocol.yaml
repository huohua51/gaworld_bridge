  - id: AP-GM-05c-r1-01
    source: EXP-GM-05c-r1
    name: review_action_output_contract_gap
    status: backlog
    layer: agent_protocol
    ranking_eligible: false
    summary: >
      Rule 审核轨可通过，模型 16/18 格 model_contract_failure。
      更准确的缺口是当前 Agent—平台审核动作契约不兼容，还不能笼统写成
      GAWorld 底层通道损坏。第一次回复常有唯一结构化字段，但键名与 schema
      不一致；格式重试把输出改坏。GM-05 已关闭，不再围着审核 JSON 打转。
    evidence:
      first_pass_unique_but_wrong_keys:
        - aid control: decision=revise, mismatches path=MIN_AGE old_value/new_value
        - hours control: decision=revise, mismatches path=max_hours
        - route intervention: decision=revise, HIGH_PRIORITY_THRESHOLD 7→6
      retry_collapse: '{"review_action":{"required_change":"Yes"}}'
      valid_cells:
        - gm05b_route_closed_001_control_multi
        - gm05b_route_closed_001_control_drop
    do_not:
      - 继续调审核提示词后重跑同一 18 格
      - 把第一次错误键名离线猜成动作后当正式分
      - 开 04f 或补 repeat 1/2
    retest: >
      若再测完整工作流，必须先有可解析审核动作的平台契约，
      且 Coverage=1.0。不要用 L2 题，不要用原 04e 开发集。

