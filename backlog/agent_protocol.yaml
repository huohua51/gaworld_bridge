# Agent-protocol improvements. Not platform-repair items.
# Freeze EXP-GM-04c 54 cells as the regression set after any protocol change.

items:
  - id: AP-04c-01
    source: EXP-GM-04c
    name: false_positive_revision
    status: backlog
    layer: agent_protocol
    ranking_eligible: false
    summary: >
      Reviewer 在草稿已满足登记标准时仍输出 decision=revise。
      返还率和预算题的 control Full 上稳定出现。
    evidence:
      - w1_return_floor_control_full_review (3/3, advice=false)
      - w1_budget_remaining_control_full_review (3/3, advice=false)
    proposed_tries:
      - bind review fields to concrete code locations
      - require approve when observed == required_change
      - post-rework automatic re-review
    retest: >
      EXP-GM-04c 旧 54 格作 regression。04d-A 看开发集 Full-control；
      普适性看 held-out：shipping_threshold / eligibility_age / inventory_reorder_point。
    source: EXP-GM-04c
    name: incomplete_required_change_adoption
    status: backlog
    layer: agent_protocol
    ranking_eligible: false
    summary: >
      Executor 收到正确 revise 后只改 SPEC_VERSION，不改 required_change 数值。
      最低返还干预 Full 三次均为 SPEC_VERSION=v2 且 RATE=0.3。
    evidence:
      - w1_return_floor_intervention_full_review (3/3, advice=true, artifact v2, value stale)
    proposed_tries:
      - bind required_change keys to identifier rewrite
      - post-rework automatic re-review against required_change
    retest: >
      EXP-GM-04c 旧 54 格作 regression。04d-B 看开发集 Full-intervention PatchAdoptionRate；
      普适性看 held-out 三题。环境不得替 Executor 改文件。
    source: EXP-GM-I1
    name: dispatcher_action_value_field_swap
    status: fixed_on_i1_direct_verified_state
    summary: >
      I1 Focused 避难所 control 曾把 action 与 value 填反。契约小修后重跑 18 格，
      direct_verified_state=1.0。REL1 Focused 避难所同类错误仍在，不自动视为已修。
    evidence:
      - shelter_capacity_001_control_focused (I1 3/3)
      - shelter_capacity_001_control_focused (REL1 3/3, value=None)
      - shelter_capacity_001_intervention_focused (REL1 3/3, update action/value 错填)
    proposed_tries:
      - schema-constrain action/value enums
      - reject swapped fields at submit
    retest: EXP-GM-I1 frozen 72-cell matrix and EXP-GM-REL1 Focused shelter

  - id: AP-REL1-01
    source: EXP-GM-REL1
    name: majority_not_recency_update
    status: backlog
    layer: agent_protocol
    ranking_eligible: false
    summary: >
      TrustUpdater 用历史累计多数形成信任后，最新揭示结果与多数冲突时不更新。
      这是相对登记规则 latest_is_binding=true 的功能失败，不是“人类不会这样更新信任”的证据。
      道路/诊所 control Full 稳定出现：形成信 A，更新轮仍信 A。
    evidence:
      - road_status_001_control_full (3/3, trust_not_updated)
      - clinic_service_001_control_full (3/3, trust_not_updated)
    proposed_tries:
      - bind update phase to the latest outcome row only
      - reject emitting the same trusted_person_id when the new outcome contradicts it
    retest: EXP-GM-REL1 frozen 72-cell matrix, especially Full control

  - id: AP-REL1-02
    source: EXP-GM-REL1
    name: history_ignored_person_a_default
    status: backlog
    layer: agent_protocol
    ranking_eligible: false
    summary: >
      当前报告完全相同、历史显示 person_b 全对时，TrustUpdater 仍默认信 person_a。
      intervention Full 三次形成就走 A，像没读历史账本。
    evidence:
      - road_status_001_intervention_full (3/3, formation_action_incorrect)
      - shelter_capacity_001_intervention_full (3/3)
      - clinic_service_001_intervention_full (3/3)
    proposed_tries:
      - require evidence_count to cite matching history rows
      - list persons without a privileged first-slot
    retest: EXP-GM-REL1 frozen 72-cell matrix, especially Full intervention

  - id: AP-REL1-03
    source: EXP-GM-REL1
    name: dispatcher_evidence_null
    status: backlog
    layer: agent_protocol
    ranking_eligible: false
    summary: >
      道路 Focused 两轮动作正确，更新轮 evidence_message_id 写成 "None"。
      信任状态已送达并被 adopt，不算通道失败。
    evidence:
