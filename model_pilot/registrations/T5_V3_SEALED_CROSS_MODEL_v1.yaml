    - causal_contrasts_by_model
    - prompt_identity_across_models
    - model_contract_rate_by_model
    - no_untargeted_spillover
    - first_error_counts_by_model

analysis_rules:
  sealed_surface: >-
    Holdout task IDs, actors, groups, actions and state fields are disjoint from
    all T5 development tasks and receive no live model calls before registration.
  identical_protocol: >-
    Both models receive byte-identical prompts and use the same frozen scorer,
    strict JSON contract and response denominator.
  per_model_success: >-
    A model succeeds only if all nine cells are measurement-valid and FullPass,
    with behavior rates 0.0, 0.5 and 0.0 for absence, binding and nonbinding.
  cross_model_exact_agreement: >-
    For each task-policy-state pair, both models must have identical scope
    booleans, actions and FullPass. Free-text reason is excluded.
  first_model_nonadaptive: >-
    GLM-5.2 results cannot change gpt-5.4 tasks, prompts, oracle, scorer,
    denominator or stopping rules.
  strict_json_no_markdown_normalization: true
  no_post_hoc_prompt_change: true
  no_replacement_calls: true
  invalid_responses_remain_in_denominator: true
  preserve_all_t5_development_evidence: true

claim_boundary: >-
  This is a seed-0, three-task sealed functional holdout across two models. It
  supports fresh-surface and cross-model protocol evidence, but not human
  validity, real-world policy effects, broad model generalization or ranking.

stopping_rules:
  - Run GLM-5.2's nine cells before gpt-5.4's nine cells.
  - Complete both registered model matrices regardless of the first result,
    unless credentials, provider availability or the fixed budget blocks calls.
  - Stop before any model exceeds its 36-call budget or total calls exceed 72.
  - Do not retry a structurally valid response.
  - Do not replace an invalid or failed cell.

planned_entrypoint: python -m model_pilot.t5_v3_sealed_cross_model
credential_policy: PARATERA_API_KEY and ANTHROPIC_API_KEY are environment-only and never logged
