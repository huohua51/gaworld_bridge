registered_oracle:
  absence:
    notice_seen: false
    binding: false
    behavior_change_rate: 0.0
    full_pass_rate: 1.0
  binding:
    notice_seen: true
    binding: true
    behavior_change_rate: 0.5
    full_pass_rate: 1.0
  nonbinding:
    notice_seen: true
    binding: false
    behavior_change_rate: 0.0
    full_pass_rate: 1.0
  causal_contrasts:
    binding_minus_absence: 0.5
    binding_minus_nonbinding: 0.5
    nonbinding_minus_absence: 0.0
  model_contract_rate: 1.0
  policy_semantics_rate: 1.0
  policy_response_rate: 1.0

outcomes:
  primary:
    - full_pass_by_policy_state
    - policy_semantics_rate
    - policy_response_rate
    - behavior_change_rate_by_policy_state
    - binding_minus_absence
    - binding_minus_nonbinding
  secondary:
    - nonbinding_minus_absence
    - model_contract_rate
    - no_untargeted_spillover
    - first_error_counts

analysis_rules:
  absence: >-
    Every response must report notice_seen=false and binding=false, and every
    resident must keep_current.
  binding: >-
    Every response must report notice_seen=true and binding=true; exactly the
    two registered eligible residents per task must adopt required_action.
  nonbinding: >-
    Every response must report notice_seen=true and binding=false, and every
    resident must keep_current regardless of eligibility.
  authorization_boundary: >-
    Resident identity, group, current state, policy topic and allowed-actions
    membership never authorize a non-default action.
  behavior_change: >-
    Count only state changes caused by recorded resident_action_submitted events.
  no_post_hoc_prompt_change: true
  no_replacement_calls: true
  invalid_responses_remain_in_denominator: true

claim_boundary: >-
  This is a three-task seed-0 functional pilot of explicit policy semantics.
  It does not estimate real-world policy effects, human validity, repeated-run
  stability, broad topic generalization or leaderboard performance.

stopping_rules:
  - Stop after all nine registered cells finish.
  - Stop before any call that would exceed the shared 36-call budget.
  - Do not retry a structurally valid model response.
  - Do not replace an invalid or failed cell during the registered run.

planned_entrypoint: python -m model_pilot.t5_v2_run
credential_policy: PARATERA_API_KEY is read from the environment and never logged
