outcomes:
  primary:
    - source_forward_exact_agreement_by_task_variant_seed0_1_2
    - complete_path_rate_by_task_variant_seed0_1_2
    - target_acceptance_rate_by_task_variant_seed0_1_2
    - full_pass_rate_by_task_variant_seed0_1_2
  secondary:
    - model_contract_rate
    - first_error_counts
    - source_prompt_hash_stability

analysis_rules:
  exact_agreement: >-
    True only when the seed-0, repeat-1 and repeat-2 source_forward values are
    identical for the same task and variant.
  success_stability: >-
    A task-variant pair is stable-success only when all three runs have
    source_forward=true, complete path, target acceptance, valid measurement,
    structured model responses and FullPass=1.
  prompt_stability: >-
    The source prompt SHA-256 must be identical across seed 0, 1 and 2 for each
    task-variant pair.
  no_post_hoc_prompt_change: true
  no_replacement_calls: true
  invalid_responses_remain_in_denominator: true
  preserve_seed0_and_t4_v1: true

stopping_rules:
  - Stop after all 12 new registered cells finish.
  - Stop before any call that would exceed the shared 48-call budget.
  - Do not retry a structurally valid model response.
  - Do not replace an invalid or failed cell during the registered run.

planned_entrypoint: python -m model_pilot.t4_v2_repeats
credential_policy: PARATERA_API_KEY is read from the environment and never logged
