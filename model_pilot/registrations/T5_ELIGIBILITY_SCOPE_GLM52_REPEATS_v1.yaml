    - first_error_counts

analysis_rules:
  prompt_scope_contract: >-
    The prompt must contain no required_action key. Global notice data use
    policy_action; resident_directive.action is the sole action authority.
  absence: >-
    Every response reports notice_seen=false, binding=false,
    target_match=false and authorized=false, then keeps current.
  binding: >-
    Every response reports the registered target match. Only target-matched
    residents report authorized=true and take policy_action; all others keep.
  nonbinding: >-
    Target match remains observable, but every resident reports
    authorized=false and keeps current.
  exact_repeat_agreement: >-
    Repeat 1 and repeat 2 must have identical structured semantic outputs,
    actions and FullPass for each task-policy-state pair.
  prompt_stability: >-
    Each resident prompt SHA-256 must be identical between repeat 1 and repeat 2.
  protocol_change_boundary: >-
    T5-v2 seed 0 used a different prompt protocol and is not combined with the
    v3 repeats for stability estimates.
  no_post_hoc_prompt_change: true
  no_replacement_calls: true
  invalid_responses_remain_in_denominator: true
  preserve_t5_v1_and_v2: true

claim_boundary: >-
  This is a post-diagnostic development regression on the three frozen T5-v2
  task surfaces. It tests protocol repair repeatability, not fresh-task
  generalization, human validity, real-world effects or leaderboard performance.

stopping_rules:
  - Stop after all 18 registered cells finish.
  - Stop before any call that would exceed the shared 72-call budget.
  - Do not retry a structurally valid model response.
  - Do not replace an invalid or failed cell during the registered run.

planned_entrypoint: python -m model_pilot.t5_v3_repeats
credential_policy: PARATERA_API_KEY is read from the environment and never logged
