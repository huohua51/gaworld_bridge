analysis_rules:
  sealed_surface: >-
    Holdout task IDs, policy IDs, channels, actors, groups, actions and state
    fields are disjoint from every prior T5 development and holdout task and
    receive no live model calls before this registration is pushed.
  identical_protocol: >-
    All models and repeats receive byte-identical prompts for a given task,
    policy state and resident and use the same frozen scorer and denominator.
  per_model_success: >-
    A model succeeds only if all twenty-four cells are measurement-valid and
    FullPass, with behavior rates 0.0, 0.5 and 0.0 for absence, binding and
    nonbinding.
  cross_model_exact_agreement: >-
    For each of twenty-four seed-task-policy-state units, all three models must
    have identical scope booleans, actions and FullPass; free-text reason is excluded.
  within_model_repeat_exact_agreement: >-
    For each of thirty-six model-task-policy-state units, seed 0 and seed 1
    must have identical scope booleans, actions and FullPass.
  first_result_nonadaptive: >-
    Earlier model or repeat results cannot change later tasks, prompts, oracle,
    scorer, denominator, execution order or stopping rules.
  strict_json_no_markdown_normalization: true
  no_post_hoc_prompt_change: true
  no_replacement_calls: true
  invalid_responses_remain_in_denominator: true
  transport_retry_policy: >-
    A bounded retry is permitted only inside one reserved logical call for a
    transient HTTP transport error; it does not replace a valid or invalid response.
  preserve_all_prior_t5_evidence: true

claim_boundary: >-
  This is a two-repeat, four-task sealed functional holdout across three
  models. It supports additional fresh-surface, cross-model and repeated-input
  protocol evidence, but not human validity, real-world policy effects, broad
  task or model generalization, provider-seed reproducibility or ranking.

stopping_rules:
  - Run models in the registered order GLM-5.2, gpt-5.4, qwen3.7-plus.
  - Within each model run seed 0 then seed 1, preserving registered task and state order.
  - Complete every registered matrix regardless of earlier outcomes unless credentials, provider availability or the fixed budget blocks calls.
  - Stop before any model exceeds 96 logical calls or total calls exceed 288.
  - Do not retry a structurally valid response.
  - Do not replace an invalid or failed cell.

planned_entrypoint: python -m model_pilot.t5_v3_expanded_repeats
credential_policy: PARATERA_API_KEY and ANTHROPIC_API_KEY are environment-only and never logged
