registered_oracle:
  no_policy:
    changed_agent_ids: []
    behavior_change_rate: 0.0
    full_pass: 1
  real_policy:
    changed_agent_ids: [lez-car-1, lez-car-2]
    behavior_change_rate: 0.5
    full_pass: 1
  placebo_policy:
    changed_agent_ids: []
    behavior_change_rate: 0.0
    full_pass: 1
  causal_contrasts:
    real_minus_no_policy: 0.5
    real_minus_placebo: 0.5
    placebo_minus_no_policy: 0.0

outcomes:
  primary:
    - full_pass_by_condition
    - changed_agent_ids_by_condition
    - behavior_change_rate_by_condition
    - real_minus_no_policy
    - real_minus_placebo
  secondary:
    - placebo_minus_no_policy
    - model_contract_rate
    - no_untargeted_spillover
    - first_error_counts

analysis_rules:
  behavior_change: >-
    Count only state changes caused by recorded resident_action_submitted events.
  targeted_response: >-
    Under real_policy, exactly lez-car-1 and lez-car-2 must change by adopting
    use_park_and_ride. Every other resident must keep_current.
  baseline_and_placebo: >-
    No resident may change under no_policy or placebo_policy.
  no_post_hoc_prompt_change: true
  no_replacement_calls: true
  invalid_responses_remain_in_denominator: true

claim_boundary: >-
  This is a one-task seed-0 functional causal-chain pilot. It does not estimate
  real-world policy effects, human validity, cross-task generalization or
  leaderboard performance.

stopping_rules:
  - Stop after all three registered cells finish.
  - Stop before any call that would exceed the shared 12-call budget.
  - Do not retry a structurally valid model response.
  - Do not replace an invalid or failed cell during the registered run.

planned_entrypoint: python -m model_pilot.t5_minimal
credential_policy: PARATERA_API_KEY is read from the environment and never logged
