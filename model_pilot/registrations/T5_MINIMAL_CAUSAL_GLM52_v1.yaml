  model: GLM-5.2
  base_url: https://llmapi.paratera.com/v1
  temperature: 0.0
  thinking: disabled
  max_tokens_per_call: 256

design:
  task_id: t5_low_emission_zone
  conditions: [no_policy, real_policy, placebo_policy]
  track: full
  seed: 0
  residents_per_cell: 4
  cells: 3
  max_calls: 12
  execution_order: condition_then_resident
  prompt_protocol: gaworld-benchmark-t5-model-v1
  scorer_version: model-pilot-t5-scorer-v1

